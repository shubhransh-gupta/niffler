name: Patch Pilot Autonomous PR Review & Self-Healing

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled]
  workflow_dispatch:

jobs:
  patch-pilot-ci:
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && (contains(github.event.comment.body, '/heal') || contains(github.event.comment.body, '/review') || contains(github.event.comment.body, '@patch-pilot') || contains(github.event.comment.body, 'patch-pilot'))) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt || true; fi
          if [ -f "pyproject.toml" ]; then pip install -e . || true; fi

      - name: Execute Patch Pilot Self-Healing & PR Verification
        uses: shubhransh-gupta/patch-pilot@v1
        with:
          api-key: ${{ secrets.GEMINI_API_KEY }}
          provider: 'gemini'
          issue: 'Verify all unit tests pass, diagnose any regressions, and auto-heal bugs'
          max-attempts: '3'

      - name: Post Autonomous PR Review Comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python3 .github/scripts/generate_patch_pilot_review.py "$PR_NUMBER" --post
          fi
